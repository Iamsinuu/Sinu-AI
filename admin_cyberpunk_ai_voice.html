<body class="text-white font-sans antialiased bg-[radial-gradient(circle_at_center,_#160b24_0%,_#08080a_100%)]">

    <!-- 1. LOGIN GATEWAY -->

        <div class="bg-[#12100e]/80 border border-accentGold/30 backdrop-blur-[20px] py-10 px-8 rounded-[22px] text-center shadow-[0_20px_40px_rgba(0,0,0,0.8),0_0_30px_rgba(168,85,247,0.15)] w-[90%] max-w-[400px]">
            <div class="flex flex-col items-center mb-6">
                <div class="w-[85px] h-[85px] rounded-full flex items-center justify-center mb-4 overflow-hidden relative"><img class="brand-profile" src="https://i.ibb.co/FqWbjJ5Z/IMG-20260722-133605-362.jpg" alt="X JȺȺͲ ͲƐȺⱮ profile"></div>
                <h1 class="m-0 text-white font-orbitron tracking-[2px] text-2xl">X JȺȺͲ ͲƐȺⱮ</h1>

            </div>
            <form id="loginForm" class="space-y-4">
                <div class="relative">
                    <input type="url" id="dbUrl" required placeholder="Firebase URL (https://...)" class="w-full bg-[#08080a]/60 border border-borderGold/30 rounded-xl py-3.5 px-4 text-sm focus:outline-none focus:border-accentGold text-white font-mono">
                </div>
                <div class="relative">
                    <input type="password" id="dbToken" placeholder="Database Secret Token (Optional)" class="w-full bg-[#08080a]/60 border border-borderGold/30 rounded-xl py-3.5 px-4 text-sm focus:outline-none focus:border-accentGold tracking-widest text-white font-mono">
                </div>

                <button type="submit" id="authBtn" class="w-full bg-gradient-to-r from-accentGold to-purple-600 text-black font-orbitron font-bold py-3.5 rounded-xl transition-all mt-4 tracking-wider">
                    AUTHORIZE

    <!-- 2. MAIN ADMIN DASHBOARD -->
    <div id="dashboardView" class="hidden app-wrapper">
      <div class="cyber-bg"></div>
      <header class="topbar">
        <button type="button" onclick="switchTab('dashboard')" class="brand">
          <img class="brand-profile" src="https://i.ibb.co/FqWbjJ5Z/IMG-20260722-133605-362.jpg" alt="X JȺȺͲ ͲƐȺⱮ profile">
          <div><div class="brand-title">X JȺȺͲ ͲƐȺⱮ</div><div class="brand-sub">LIVE FIREBASE SYNC // LOCAL ARCHIVE ENGINE</div></div>
        </button>
        <button class="sync-btn" onclick="fetchDatabase();speakAssistant('Database sync started');">SYNC ⟳</button>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <button class="side-item active" data-side="dashboard" onclick="switchTab('dashboard')"><span class="side-icon">⌂</span>DASHBOARD</button>
          <button class="side-item" data-side="active" onclick="switchTab('active')"><span class="side-icon">♙</span>ACTIVE USERS</button>
          <button class="side-item" data-side="expired" onclick="switchTab('expired')"><span class="side-icon">⌛</span>EXPIRED USERS</button>
          <button class="side-item" data-side="deleted" onclick="switchTab('deleted')"><span class="side-icon">▣</span>DELETED USERS</button>
          <button class="side-item" data-side="sinu" onclick="switchTab('sinu')"><span class="side-icon">⌕</span>SEARCH ENGINE</button>
          <button class="side-item" data-side="dialogs" onclick="switchTab('dialogs')"><span class="side-icon">▤</span>OTP / TOKENS</button>
          <button class="side-item" data-side="settings" onclick="switchTab('settings')"><span class="side-icon">⚙</span>SETTINGS</button>
          <button class="side-item" data-side="activity" onclick="switchTab('activity')"><span class="side-icon">◈</span>ACTIVITY LOG</button>
          <button class="side-item" data-side="backup" onclick="switchTab('backup')"><span class="side-icon">☁</span>BACKUP / RESTORE</button>
          <div class="side-bottom"><button class="side-item" onclick="openLogoutModal()"><span class="side-icon">⇥</span>EXIT</button><div class="developer">DEVELOPER BY:- SINU</div></div>
        </aside>

        <main class="content" id="mainContent"><button id="fabAddUser" class="hidden"></button></main>
      </div>

      <nav class="bottom">
        <button onclick="switchTab('users')" id="nav-users"><span class="ico">♙</span>DEVICES</button>
        <button onclick="switchTab('dialogs')" id="nav-dialogs"><span class="ico">▤</span>OTP / TOKENS</button>
        <button onclick="switchTab('settings')" id="nav-settings"><span class="ico">⚙</span>SETTINGS</button>
        <button onclick="openLogoutModal()" class="exit"><span class="ico">⇥</span>EXIT</button>
      </nav>

    <!-- 3. ADD / EDIT USER MODAL -->
    <div id="userModal" class="hidden fixed inset-0 bg-black/80 z-[60] flex justify-center items-center backdrop-blur-sm p-4">
        <div class="bg-[#12100e] border border-borderGold/40 w-full max-w-sm rounded-[24px] p-6 relative">
            <button onclick="closeModal()" class="absolute top-5 right-5 bg-white/10 p-1.5 rounded-full text-gray-300">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
            <h2 id="modalTitle" class="font-orbitron font-bold text-xl text-white uppercase tracking-wider mb-4">ADD DEVICE</h2>
            
            <input type="hidden" id="modalMode" value="add">
            <input type="hidden" id="originalHwid" value="">

            <div class="space-y-4">
                <div>
                    <label class="text-[10px] font-bold text-gray-300 tracking-wider mb-1.5 block uppercase">HWID</label>
                    <input type="text" id="inpHwid" placeholder="Unique HWID" required class="w-full glass-input border border-gray-800 rounded-xl py-3 px-3 text-sm text-activeGreen font-mono focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-300 tracking-wider mb-1.5 block uppercase">DEVICE MODEL</label>
                    <input type="text" id="inpModel" placeholder="e.g. POCO F4" class="w-full glass-input border border-gray-800 rounded-xl py-3 px-3 text-sm text-white focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-300 tracking-wider mb-1.5 block uppercase">PACKAGE NAME</label>
                    <input type="text" id="inpPackage" placeholder="e.g. com.example.verifydialog" class="w-full glass-input border border-gray-800 rounded-xl py-3 px-3 text-sm text-white font-mono focus:outline-none">
                </div>
                <div>
                    <label class="text-[10px] font-bold text-gray-300 tracking-wider mb-1.5 block uppercase">EXPIRY DATE & TIME</label>
                    <input type="datetime-local" id="inpExpiry" class="w-full glass-input border border-gray-800 rounded-xl py-3 px-3 text-sm text-white font-mono" style="color-scheme: dark;">
                </div>
                
                <div class="pt-3 space-y-2">
                    <button onclick="saveUser()" class="w-full bg-gradient-to-r from-accentGold to-purple-600 text-black font-orbitron font-bold py-3.5 rounded-xl tracking-wider">SAVE DEVICE</button>
                    <button id="btnDeleteUser" onclick="deleteUser()" class="hidden w-full bg-red-500/10 border border-red-500/30 text-red-500 font-bold py-3.5 rounded-xl">REVOKE ACCESS</button>

    <!-- LOGOUT MODAL -->
    <div id="logoutModal" class="hidden fixed inset-0 bg-black/80 z-[70] flex justify-center items-center backdrop-blur-sm p-4">
        <div class="bg-[#12100e] border border-borderGold/30 w-full max-w-[320px] rounded-[24px] p-6 text-center">
            <h3 class="font-sans font-bold text-white text-[17px] mb-6">Are you sure you want to logout?</h3>
            <div class="flex gap-3">
                <button onclick="closeLogoutModal()" class="w-1/2 bg-gray-200 text-black font-bold py-3 rounded-xl text-sm">CANCEL</button>
                <button onclick="confirmLogout()" class="w-1/2 bg-red-600 text-white font-bold py-3 rounded-xl text-sm">LOGOUT</button>
            </div>
        </div>
    </div>

    <script>
        let currentDBUrl = "";
        let currentToken = "";
        let dbData = { users: {}, otp_requests: {}, settings: { global_config: { access_hours: 24, shortener_api: "", shortener_dest: "", shortener_url: "" } } };
        let activeTab = "dashboard";
        let deletedUsers = JSON.parse(localStorage.getItem('xjaat_deleted_users') || '[]');
        let expiredUsers = JSON.parse(localStorage.getItem('xjaat_expired_users') || '[]');
        function saveArchives(){ localStorage.setItem('xjaat_deleted_users',JSON.stringify(deletedUsers)); localStorage.setItem('xjaat_expired_users',JSON.stringify(expiredUsers)); }
        function archiveExpiredUsers(){
            const now=Date.now(); let changed=false;
            Object.entries(dbData.users||{}).forEach(([hwid,u])=>{ const exp=Date.parse((u.expiry||'').replace(' ','T')); if(exp && exp<=now){ expiredUsers.unshift({hwid,...u,archived_at:new Date().toISOString()}); delete dbData.users[hwid]; changed=true; }});
            if(changed){saveArchives(); addActivity('Auto-archived expired user(s)'); pushDatabaseelitemods();}
        }

        const SAVED_LOGIN_KEY = "elitemods_saved_login_v3";

        function initBackgroundEngine() {
            setInterval(() => {
                if (currentDBUrl) {
                    let authParam = currentToken ? `?auth=${currentToken}&shallow=true` : `?shallow=true`;
                    fetch(`${currentDBUrl}/.json${authParam}`).catch(() => {});
                }
            }, 25000);
        }
        initBackgroundEngine();

        let activityLog=JSON.parse(localStorage.getItem('xjaat_activity_log')||'[]');
        function addActivity(m){activityLog.unshift({t:Date.now(),m});activityLog=activityLog.slice(0,100);localStorage.setItem('xjaat_activity_log',JSON.stringify(activityLog));}
        function clearActivityLog(){activityLog=[];localStorage.setItem('xjaat_activity_log','[]');renderTab();}
        function clearArchives(){if(confirm('Clear local expired/deleted archives?')){expiredUsers=[];deletedUsers=[];saveArchives();addActivity('Local archives cleared');renderTab();}}
        function exportUsers(){const blob=new Blob([JSON.stringify(dbData.users||{},null,2)],{type:'application/json'});downloadBlob(blob,'users.json');addActivity('Users exported');}
        function exportFullBackup(){const data={dbData,expiredUsers,deletedUsers,activityLog,exported_at:new Date().toISOString()};downloadBlob(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),'x-jaat-admin-backup.json');addActivity('Full backup exported');}
        function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);}
        function restoreBackupFile(e){const f=e.target.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(x.dbData)dbData=x.dbData;if(Array.isArray(x.expiredUsers))expiredUsers=x.expiredUsers;if(Array.isArray(x.deletedUsers))deletedUsers=x.deletedUsers;saveArchives();addActivity('Backup restored locally');renderTab();alert('Backup restored locally. Press SYNC DATABASE to push to Firebase.')}catch(err){alert('Invalid backup JSON')}};r.readAsText(f);}
        function showSystemInfo(){alert(`X JȺȺͲ ͲƐȺⱮ\nUsers: ${Object.keys(dbData.users||{}).length}\nExpired archive: ${expiredUsers.length}\nDeleted archive: ${deletedUsers.length}\nFirebase: ${currentDBUrl?'CONNECTED':'NOT CONNECTED'}\nVoice API: ${('speechSynthesis' in window)?'READY':'UNAVAILABLE'}`)}
        // ================= SINU AI VOICE / CHAT ENGINE =================
        const AI_API_URL = window.SINU_AI_API_URL || '/api/assistant';
        const AI_VOICE_API_URL = window.SINU_AI_VOICE_API_URL || '/api/voice';
        let recognition=null, micStream=null, mediaRecorder=null, recordedChunks=[];
        let aiBusy=false;
        const aiHistory=[];

        function setVoiceStatus(text){const out=document.getElementById('voiceText');if(out)out.textContent=text;}
        function setHolo(mode){const h=document.getElementById('hologram');if(!h)return;h.classList.remove('listening','speaking');if(mode)h.classList.add(mode);}

        async function requestMicPermission(){
          try{
            if(!navigator.mediaDevices?.getUserMedia) throw new Error('Microphone API unavailable');
            micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
            micStream.getTracks().forEach(t=>t.stop());
            setVoiceStatus('MICROPHONE READY — SINU AI can hear you.');
            addActivity('Microphone permission granted');
            return true;
          }catch(e){
            setVoiceStatus('MICROPHONE DENIED — allow microphone permission and use HTTPS.');
            addActivity('Microphone permission denied');
            return false;
          }
        }

        async function speakAssistant(text){
          if(!text)return;
          const clean=String(text).replace(/[*_`#]/g,'').slice(0,4000);
          const out=document.getElementById('voiceText'); if(out) out.textContent='SINU AI: '+clean;
          if('speechSynthesis' in window){
            const h=document.getElementById('hologram');
            const u=new SpeechSynthesisUtterance(clean);
            u.lang='en-IN'; u.rate=.96; u.pitch=1.02;
            const voices=speechSynthesis.getVoices();
            const preferred=voices.find(v=>/^en-IN/i.test(v.lang))||voices.find(v=>/^hi-IN/i.test(v.lang))||voices.find(v=>/^en-US/i.test(v.lang));
            if(preferred)u.voice=preferred;
            u.onstart=()=>setHolo('speaking');
            u.onend=()=>setHolo('');
            u.onerror=()=>{setHolo('');serverSpeak(clean)};
            speechSynthesis.cancel(); speechSynthesis.speak(u);
          }else{await serverSpeak(clean);}
        }
        async function serverSpeak(text){
          try{
            setHolo('speaking');
            const r=await fetch('/api/speak',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});
            if(!r.ok)throw new Error('TTS '+r.status);
            const blob=await r.blob(); const url=URL.createObjectURL(blob); const audio=new Audio(url);
            audio.onended=()=>{URL.revokeObjectURL(url);setHolo('')}; audio.onerror=()=>{URL.revokeObjectURL(url);setHolo('')}; await audio.play();
          }catch(e){setHolo('');setVoiceStatus('AI TEXT READY — audio output unavailable.');}
        }

        function localCommand(t){
          const q=t.toLowerCase();
          if(q.includes('active')){switchTab('active');return 'Opening active users.';}
          if(q.includes('expired')){switchTab('expired');return 'Opening expired users.';}
          if(q.includes('deleted')){switchTab('deleted');return 'Opening deleted users.';}
          if(q.includes('search')){switchTab('sinu');return 'Opening the Sinu search engine.';}
          if(q.includes('setting')){switchTab('settings');return 'Opening system settings.';}
          if(q.includes('token')||q.includes('otp')){switchTab('dialogs');return 'Opening OTP and token requests.';}
          if(q.includes('dashboard')||q.includes('home')){switchTab('dashboard');return 'Opening dashboard.';}
          if(q.includes('refresh')||q.includes('sync')){fetchDatabase();return 'Synchronizing the database now.';}
          return null;
        }

        async function askSinuAI(text){
          const prompt=String(text||'').trim(); if(!prompt||aiBusy)return;
          aiBusy=true; setHolo('speaking'); setVoiceStatus('SINU AI THINKING...');
          const local=localCommand(prompt);
          try{
            aiHistory.push({role:'user',content:prompt});
            const r=await fetch(AI_API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:prompt,history:aiHistory.slice(-12),context:{active:Object.keys(users||{}).length,expired:expiredUsers.length,deleted:deletedUsers.length,currentPage:activeTab}})});
            if(!r.ok)throw new Error('AI server '+r.status);
            const data=await r.json();
            const reply=data.reply||data.output_text||data.text;
            if(!reply)throw new Error('Empty AI reply');
            aiHistory.push({role:'assistant',content:reply});
            addActivity('SINU AI: '+prompt.slice(0,70));
            setHolo(''); speakAssistant(reply);
          }catch(err){
            aiHistory.pop();
            const reply=local || 'AI server is not connected yet. Your voice was heard, but I need the /api/assistant endpoint on your server to generate a real AI answer.';
            setHolo(''); speakAssistant(reply);
            addActivity('AI fallback: '+err.message);
          }finally{aiBusy=false;}
        }

        async function startListening(){
          if(!await requestMicPermission())return;
          const R=window.SpeechRecognition||window.webkitSpeechRecognition;
          if(!R){setVoiceStatus('BROWSER STT UNAVAILABLE — use SERVER VOICE mode.');return startServerRecording();}
          if(recognition){try{recognition.stop();}catch(e){}}
          recognition=new R(); recognition.lang='en-IN'; recognition.interimResults=true; recognition.continuous=false; recognition.maxAlternatives=1;
          recognition.onstart=()=>{setHolo('listening');setVoiceStatus('LISTENING... Speak naturally.');};
          recognition.onresult=e=>{
            const text=Array.from(e.results).map(r=>r[0].transcript).join(' ');
            setVoiceStatus('YOU: '+text);
            if(e.results[e.results.length-1].isFinal) askSinuAI(text);
          };
          recognition.onerror=()=>{setHolo('');setVoiceStatus('VOICE RECOGNITION ERROR — retrying with server voice is recommended.');};
          recognition.onend=()=>{if(!aiBusy)setHolo('');};
          try{recognition.start();}catch(e){}
        }

        async function startServerRecording(){
          if(mediaRecorder && mediaRecorder.state==='recording'){mediaRecorder.stop();return;}
          try{
            const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
            const mime=MediaRecorder.isTypeSupported('audio/webm;codecs=opus')?'audio/webm;codecs=opus':'audio/webm';
            mediaRecorder=new MediaRecorder(stream,{mimeType:mime}); recordedChunks=[];
            mediaRecorder.ondataavailable=e=>{if(e.data.size)recordedChunks.push(e.data)};
            mediaRecorder.onstart=()=>{setHolo('listening');setVoiceStatus('SERVER VOICE: RECORDING — press LISTEN again to send.');};
            mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());setHolo('');setVoiceStatus('TRANSCRIBING...');
              try{const blob=new Blob(recordedChunks,{type:mime});const fd=new FormData();fd.append('audio',blob,'voice.webm');const r=await fetch(AI_VOICE_API_URL,{method:'POST',body:fd});if(!r.ok)throw new Error('Voice server '+r.status);const d=await r.json();if(d.transcript)setVoiceStatus('YOU: '+d.transcript);if(d.reply) speakAssistant(d.reply);else if(d.transcript) await askSinuAI(d.transcript);}catch(e){setVoiceStatus('SERVER VOICE ERROR — '+e.message);}};
            mediaRecorder.start();
          }catch(e){setVoiceStatus('MICROPHONE ERROR — '+e.message);}
        }

                document.getElementById("dbUrl").value = saved.url;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            currentDBUrl = document.getElementById('dbUrl').value.replace(/\/$/, '');
            currentToken = document.getElementById('dbToken').value.trim();
            
            let authParam = currentToken ? `?auth=${currentToken}&shallow=true` : `?shallow=true`;
            try {
                const res = await fetch(`${currentDBUrl}/.json${authParam}`);

        async function fetchDatabase() {
            try {
                let authParam = currentToken ? `?auth=${currentToken}` : ``;
                const res = await fetch(`${currentDBUrl}/.json${authParam}`);
                if (res.ok) {
                    const data = await res.json();
                    if(data) dbData = data;
                    if(!dbData.users) dbData.users = {};
                    if(!dbData.otp_requests) dbData.otp_requests = {};
                    if(!dbData.settings) dbData.settings = {};
                    archiveExpiredUsers();
                    if(!dbData.settings.global_config) {
                        dbData.settings.global_config = { access_hours: 24, shortener_api: "", shortener_dest: "", shortener_url: "" };
                    }

                    let accessHours = Number(dbData.settings.global_config.access_hours) || 24;

                    let updateNeeded = false;
                    for (const [hwid, details] of Object.entries(dbData.users)) {
                        if (!details.expiry) {
                            let baseTime = details.timestamp ? Number(details.timestamp) : Date.now();
                            let expiryTimeMs = baseTime + (accessHours * 60 * 60 * 1000);
                            let d = new Date(expiryTimeMs);
                            
                            dbData.users[hwid].expiry = d.getFullYear() + '-' + 
                                String(d.getMonth() + 1).padStart(2, '0') + '-' + 
                                String(d.getDate()).padStart(2, '0') + ' ' + 
                                String(d.getHours()).padStart(2, '0') + ':' + 
                                String(d.getMinutes()).padStart(2, '0') + ':00';
                            updateNeeded = true;
                        }
                    }

                    if (updateNeeded) {
                        await pushDatabaseelitemods();
                    }

                    renderTab();
                }
            } catch (e) {}
        }

        async function pushDatabaseelitemods() {
            let authParam = currentToken ? `?auth=${currentToken}` : ``;
            await fetch(`${currentDBUrl}/.json${authParam}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dbData)
            });
        }

        async function pushDatabase() {
            await pushDatabaseelitemods();
            fetchDatabase();
        }

        }

        function deleteDialog(hwid) {
            if(confirm("Delete this OTP request entry?")) {
                delete dbData.otp_requests[hwid];
                pushDatabase();
            }
        }

        function openModal(mode, hwid = '') {
            document.getElementById('userModal').classList.remove('hidden');
            document.getElementById('modalMode').value = mode;
            document.getElementById('originalHwid').value = hwid;
            
            if(mode === 'edit') {
                document.getElementById('modalTitle').innerText = "EDIT DEVICE";
                const user = dbData.users[hwid] || {};
                document.getElementById('inpHwid').value = hwid;
                document.getElementById('inpHwid').disabled = true;
                document.getElementById('inpModel').value = user.model || user.device_model || "";
                document.getElementById('inpPackage').value = user.package_name || "";
                
                if (user.expiry) {
                    let formattedExp = user.expiry.replace(' ', 'T').substring(0, 16);
                    document.getElementById('inpExpiry').value = formattedExp;
                } else {
                    document.getElementById('inpExpiry').value = "";
                }
                document.getElementById('btnDeleteUser').classList.remove('hidden');
            } else {
                document.getElementById('modalTitle').innerText = "ADD DEVICE";
                document.getElementById('inpHwid').value = "";
                document.getElementById('inpHwid').disabled = false;
                document.getElementById('inpModel').value = "";
                document.getElementById('inpPackage').value = "";
                
                let defaultExp = new Date(Date.now() + 24 * 60 * 60 * 1000);
                document.getElementById('inpExpiry').value = defaultExp.toISOString().slice(0, 16);
                
                document.getElementById('btnDeleteUser').classList.add('hidden');
            }
        }

        function closeModal() { document.getElementById('userModal').classList.add('hidden'); }

        function saveUser() {
            const mode = document.getElementById('modalMode').value;
            const origHwid = document.getElementById('originalHwid').value;
            const newHwid = document.getElementById('inpHwid').value.trim();
            const model = document.getElementById('inpModel').value.trim();
            const packageName = document.getElementById('inpPackage').value.trim();
            let expiryVal = document.getElementById('inpExpiry').value;

            if(!newHwid) return alert("HWID is required!");
            
            if (expiryVal) {
                expiryVal = expiryVal.replace('T', ' ') + ':00';
            } else {
                let d = new Date(Date.now() + 24 * 60 * 60 * 1000);
                expiryVal = d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') + ' ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0') + ':00';
            }

            if(mode === 'edit' && origHwid !== newHwid) {
                delete dbData.users[origHwid];
            }

            dbData.users[newHwid] = {
                hwid: newHwid,
                model: model,
                package_name: packageName,
                expiry: expiryVal,
                timestamp: Date.now(),
                token: ""
            };

            pushDatabase();
            addActivity((mode==='edit'?'Updated':'Added')+' device '+newHwid);
            closeModal();
        }

        function deleteUser() {
            if(dbData.users && dbData.users[document.getElementById('originalHwid').value]){ deletedUsers.unshift({hwid:document.getElementById('originalHwid').value,...dbData.users[document.getElementById('originalHwid').value],deleted_at:new Date().toISOString()}); saveArchives();}
            const hwid = document.getElementById('originalHwid').value;
            if(confirm("Are you sure you want to revoke access for this device?")) {
                delete dbData.users[hwid];
                addActivity('Revoked device '+hwid);
                pushDatabase();
                closeModal();
            }
        }

        function openLogoutModal() { document.getElementById('logoutModal').classList.remove('hidden'); }
        function closeLogoutModal() { document.getElementById('logoutModal').classList.add('hidden'); }
        function confirmLogout() { localStorage.removeItem(SAVED_LOGIN_KEY); window.location.reload(); }

        restoreSavedLogin();
    </script>
</body>
</html>
